name: Build IPA

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build and archive (no code signing)
        run: |
          set -euo pipefail
          xcodebuild \
            -project ios/NavidromeUploader.xcodeproj \
            -scheme NavidromeUploader \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/NavidromeUploader.xcarchive" \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM=""

      - name: Package IPA
        run: |
          set -euo pipefail
          APP_PATH="$RUNNER_TEMP/NavidromeUploader.xcarchive/Products/Applications/NavidromeUploader.app"
          test -d "$APP_PATH"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          mkdir -p build-artifacts
          zip -r "build-artifacts/NavidromeUploader.ipa" Payload
          ls -lh build-artifacts/NavidromeUploader.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: NavidromeUploader-IPA
          path: build-artifacts/NavidromeUploader.ipa
          if-no-files-found: error
